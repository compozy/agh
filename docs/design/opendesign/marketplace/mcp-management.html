    .url-block__head{align-items:flex-start;flex-wrap:wrap}.url-block__head .eyebrow{width:100%}.url-block code{font-size:9px}.btn{min-height:32px}.btn--sm{min-height:28px}
  }
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<div class="shell" id="app-shell" data-od-id="mcp-management-shell">
  <header class="topbar" data-od-id="mcp-management-topbar">
    <div class="topbar__identity">
      <span class="topbar__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22v-5M9 8V2M15 8V2M18 8v5a6 6 0 0 1-12 0V8Z"/></svg></span>
      <h1>MCP</h1><span class="topbar__count" id="top-count">9</span>
    </div>
    <div class="topbar__actions">
      <div class="pill-group" role="radiogroup" aria-label="MCP scope" data-od-id="mcp-management-scope">
        <button type="button" role="radio" data-scope="workspace" aria-checked="true">Workspace</button>
        <button type="button" role="radio" data-scope="global" aria-checked="false">Global</button>
      </div>
      <button type="button" class="btn btn--primary btn--sm" data-action="add" aria-label="Add MCP server"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg><span class="add-label">Add server</span></button>
    </div>
  </header>
  <main class="scroll" id="main-content">
    <div class="page" data-od-id="mcp-management-page">
      <div class="context">
        <div class="context__copy">
          <div class="eyebrow">Runtime inventory</div>
          <h2>Server status</h2>
          <p>Configuration, authorization, runtime, and probe results are independent signals. A configured server is not assumed ready.</p>
          <div class="scope-context" id="scope-context">workspace · ws-platform</div>
        </div>
        <div class="legend" aria-label="Status signal legend">
          <span class="legend__item" style="color:var(--color-success)">ready or confirmed</span>
          <span class="legend__item" style="color:var(--color-warning)">operator action</span>
          <span class="legend__item" style="color:var(--color-danger)">repair required</span>
          <span class="legend__item" style="color:var(--color-neutral-ink)">not run or not used</span>
        </div>
      </div>
      <div id="selection-root"></div>
      <section id="content-root" aria-label="MCP servers" data-od-id="mcp-management-content"></section>
    </div>
  </main>
</div>
<div id="dialog-root"></div>
<div class="sr-only" aria-live="polite" id="live-region"></div>
<script>
(function(){
  var query=new URLSearchParams(location.search);
  var allowedStates=["matrix","authorize","manual","auth-failure","authenticated","editor-stdio","editor-http","editor-sse","loading","empty","error"];
  var state=allowedStates.indexOf(query.get("state"))>=0?query.get("state"):"matrix";
  var scope=query.get("scope")==="global"?"global":"workspace";
  var selected=query.get("server")||"";
  var discovery=state==="editor-sse"?"issuer":"metadata";
  var oauthEnabled=true;
  var returnFocusSelector="";

  var SERVERS=[
    {name:"github-local",transport:"stdio",endpoint:"npx -y @modelcontextprotocol/server-github",source:"workspace mcp.json",configured:true,auth:"unconfigured",authDetail:"no OAuth configuration",token:false,runtime:"ready",probe:"succeeded",tools:12,oauth:false,catalog:"github",version:"1.3.2"},
    {name:"linear",transport:"http",endpoint:"https://mcp.linear.app/mcp",source:"installed from catalog · linear@1.4.0",configured:true,auth:"needs_login",authDetail:"token absent",token:false,runtime:"auth_required",probe:"skipped",tools:null,oauth:true,catalog:"linear",version:"1.4.0"},
    {name:"sentry",transport:"sse",endpoint:"https://mcp.sentry.dev/sse",source:"installed from catalog · sentry@2.1.0",configured:true,auth:"authenticated",authDetail:"token present",token:true,runtime:"ready",probe:"succeeded",tools:18,oauth:true,catalog:"sentry",version:"2.1.0"},
    {name:"notion",transport:"http",endpoint:"https://mcp.notion.com/mcp",source:"workspace config",configured:true,auth:"expired",authDetail:"token expired",token:true,runtime:"auth_expired",probe:"skipped",tools:null,oauth:true},
    {name:"figma",transport:"sse",endpoint:"https://mcp.figma.com/sse",source:"global config",configured:true,auth:"invalid",authDetail:"token rejected",token:true,runtime:"auth_invalid",probe:"skipped",tools:null,oauth:true},
    {name:"github-remote",transport:"http",endpoint:"https://api.githubcopilot.com/mcp",source:"global config",configured:true,auth:"authenticated",authDetail:"prior token retained",token:true,runtime:"auth_refresh_failed",probe:"skipped",tools:null,oauth:true},
    {name:"filesystem",transport:"stdio",endpoint:"node ./bin/filesystem-mcp.js",source:"workspace config",configured:true,auth:"unconfigured",authDetail:"no OAuth configuration",token:false,runtime:"config_error",probe:"skipped",tools:null,oauth:false},
    {name:"pagerduty",transport:"http",endpoint:"https://mcp.pagerduty.com/mcp",source:"workspace config",configured:true,auth:"authenticated",authDetail:"token present",token:true,runtime:"permission_denied",probe:"failed",tools:null,oauth:true},
    {name:"buildkite",transport:"sse",endpoint:"https://mcp.buildkite.com/sse",source:"global config",configured:true,auth:"authenticated",authDetail:"token present",token:true,runtime:"runtime_unavailable",probe:"failed",tools:null,oauth:true}
  ];

  var ICONS={
    plug:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22v-5M9 8V2M15 8V2M18 8v5a6 6 0 0 1-12 0V8Z"/></svg>',
    close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>',
    copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
    external:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>',
    alert:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>',
    check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 12 4 4L19 6"/></svg>',
    edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg>'
  };
  var EDITOR_IDS={stdio:"mcp-stdio-editor",http:"mcp-http-editor",sse:"mcp-sse-editor"};
  function esc(value){return String(value).replace(/[&<>"']/g,function(char){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char];});}
  function setQuery(nextState,nextServer){var url=new URL(location.href);url.searchParams.set("scope",scope);if(nextState&&nextState!=="matrix")url.searchParams.set("state",nextState);else url.searchParams.delete("state");if(nextServer)url.searchParams.set("server",nextServer);else url.searchParams.delete("server");history.replaceState(null,"",url);state=nextState||"matrix";selected=nextServer||"";render();}
  function label(value){return value.replace(/_/g," ").replace(/^./,function(c){return c.toUpperCase();});}
  function authTone(server){if(server.auth==="authenticated"&&server.token)return"success";if(server.auth==="invalid")return"danger";if(server.auth==="needs_login"||server.auth==="expired")return"warning";return"neutral";}
  function runtimeTone(value){
    if(value==="ready")return"success";
    if(value==="auth_required"||value==="auth_expired")return"warning";
    if(["config_error","auth_invalid","auth_refresh_failed","permission_denied","runtime_unavailable"].indexOf(value)>=0)return"danger";
    return"neutral";
  }
  function probeTone(value){return value==="succeeded"?"success":value==="failed"?"danger":"neutral";}
  function pill(text,tone){return'<span class="pill" data-tone="'+tone+'">'+esc(text)+'</span>';}
  function statusStack(text,tone,code){return'<div class="status-stack" role="cell">'+pill(text,tone)+(code?'<div class="status-code">'+esc(code)+'</div>':'')+'</div>';}
  function row(server){
    var selectedAttr=server.name===selected?'true':'false';
    var action="";
    var repair=server.oauth&&(server.auth!=="authenticated"||server.runtime==="auth_refresh_failed");
    if(repair)action='<button type="button" class="btn btn--sm" data-authorize="'+esc(server.name)+'">'+(server.auth==="needs_login"?'Authorize':'Reauthorize')+'</button>';
    action+='<button type="button" class="btn btn--ghost btn--icon" data-edit="'+esc(server.name)+'" aria-label="Edit '+esc(server.name)+'">'+ICONS.edit+'</button>';
    var probeCode=server.probe==="succeeded"?String(server.tools)+" tools":server.probe==="skipped"?"no probe attempted":"probe attempted";
    return'<div class="server-row" role="row" aria-selected="'+selectedAttr+'" data-server="'+esc(server.name)+'" data-od-id="mcp-row-'+esc(server.name)+'">'
      +'<div class="server-main" role="cell"><span class="server-icon" aria-hidden="true">'+ICONS.plug+'</span><div><div class="server-name"><button type="button" data-select="'+esc(server.name)+'">'+esc(server.name)+'</button>'+pill(server.transport,"neutral")+'</div><div class="endpoint">'+esc(server.endpoint)+'</div><div class="source-line">'+esc(server.source)+'</div></div></div>'
      +statusStack("Configured","neutral","configured=true")
      +statusStack(label(server.auth),authTone(server),server.authDetail)
      +statusStack(label(server.runtime),runtimeTone(server.runtime),server.runtime)
      +statusStack(label(server.probe),probeTone(server.probe),probeCode)
      +'<div class="actions" role="cell">'+action+'</div></div>';
  }
  function matrixMarkup(){return'<div class="matrix" role="table" aria-label="Configured MCP server status matrix" data-od-id="mcp-status-matrix"><div class="matrix__header" role="row"><span role="columnheader">Server</span><span role="columnheader">Config</span><span role="columnheader">Authorization</span><span role="columnheader">Runtime</span><span role="columnheader">Probe / tools</span><span role="columnheader">Actions</span></div><div class="server-list" role="rowgroup">'+SERVERS.map(row).join("")+'</div></div>';}
  function loadingMarkup(){var cells='<div class="skel skel--icon"></div><div class="skel" style="width:72%"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div>';return'<div class="matrix" data-od-id="mcp-loading"><div class="matrix__header"><span>Server</span><span>Config</span><span>Authorization</span><span>Runtime</span><span>Probe / tools</span><span>Actions</span></div>'+Array(5).fill('<div class="skeleton-row">'+cells+'</div>').join("")+'</div>';}
  function emptyMarkup(){return'<div class="empty" data-od-id="mcp-empty"><span class="empty__icon">'+ICONS.plug+'</span><h2>No MCP servers configured</h2><p>Add a local stdio server or a remote HTTP/SSE server for this '+scope+' scope.</p><button class="btn btn--primary" data-action="add">Add MCP server</button></div>';}
  function errorMarkup(){return'<div class="empty" data-od-id="mcp-error"><span class="empty__icon" style="color:var(--color-danger)">'+ICONS.alert+'</span><h2>MCP servers could not be loaded</h2><p>The daemon stopped responding before it returned the scoped server list. Existing configuration was not changed.</p><button class="btn" data-action="retry">Retry load</button></div>';}
  function selectionMarkup(){if(!selected)return"";var server=SERVERS.find(function(item){return item.name===selected;});if(!server)return'<div class="alert alert--warning">'+ICONS.alert+'<div><strong>Server not found in this scope</strong><p>No row named '+esc(selected)+' was returned for '+scope+'.</p></div></div>';
    var provenance=server.catalog?'Installed from catalog · '+server.catalog+'@'+server.version:'Hand-configured server';
    return'<div class="selection-strip" data-od-id="mcp-selected-server">'+ICONS.check+'<div class="selection-strip__copy"><strong>'+esc(server.name)+' selected</strong><p>'+esc(provenance)+(server.catalog?' · <a href="marketplace-detail.html?kind=mcp&amp;name='+encodeURIComponent(server.catalog)+'">View in marketplace</a>':'')+'</p></div><button type="button" class="btn btn--ghost btn--sm" data-clear-selection>Clear</button></div>';}
  function authURL(){return"https://auth.linear.app/oauth/authorize?client_id=agh-linear-public&code_challenge=J6lRkq8l9lZ3tZpQf7uYx2AqY7M3xv2b9R6n0ZsVn4A&code_challenge_method=S256&redirect_uri=http%3A%2F%2F127.0.0.1%3A2123%2Fapi%2Fmcp%2Foauth%2Fcallback&state=agh_mcp_7m3p9q";}
  function snapshot(auth,token,runtime){return'<dl class="status-snapshot" data-od-id="mcp-auth-snapshot"><div class="snapshot-cell"><dt>Authorization</dt><dd>'+pill(label(auth),auth==="authenticated"&&token?"success":"warning")+'</dd></div><div class="snapshot-cell"><dt>Token present</dt><dd>'+pill(token?"Yes":"No",token?"success":"neutral")+'</dd></div><div class="snapshot-cell"><dt>Prior status</dt><dd class="mono">needs_login · token absent</dd></div><div class="snapshot-cell"><dt>Runtime</dt><dd class="mono">'+esc(runtime)+'</dd></div></dl>';}
  function authorizeMarkup(mode){
    var main="";
    if(mode==="auth-failure")main='<div class="alert alert--danger" role="alert">'+ICONS.alert+'<div><strong>Authorization could not be completed</strong><p>The provider rejected the code. linear remains needs_login; no existing credential was changed.</p></div></div>'+snapshot("needs_login",false,"auth_required · probe skipped");
    else if(mode==="authenticated")main='<div class="alert alert--success" role="status">'+ICONS.check+'<div><strong>Authorization confirmed</strong><p>The scoped status now reports authenticated with a present token. Runtime readiness remains an independent daemon result.</p></div></div>'+snapshot("authenticated",true,"ready · 8 tools");
    else main='<div class="alert alert--warning" role="status">'+ICONS.alert+'<div><strong>Waiting for confirmed token</strong><p>The browser step may finish automatically. This dialog stays pending until status reports authenticated and token_present.</p></div></div>';
    var url='<div class="url-block" data-od-id="mcp-authorization-url"><div class="url-block__head"><span class="eyebrow">Live URL from auth/begin</span><button type="button" class="btn btn--ghost btn--sm" data-copy-url>'+ICONS.copy+'Copy URL</button><button type="button" class="btn btn--sm" data-open-url>'+ICONS.external+'Open browser</button></div><code>'+esc(authURL())+'</code></div>';
    if(mode==="manual"||mode==="auth-failure")main+=url+'<div class="manual-panel" data-od-id="mcp-manual-completion"><label class="field-label" for="manual-value">Code or full redirect URL <span class="hint">required</span></label><textarea class="textarea mono" id="manual-value" placeholder="Paste the authorization code or the full redirected URL" aria-describedby="manual-help"></textarea><p class="field-help" id="manual-help">Use this when the browser cannot reach the daemon host. AGH sends exactly one value to auth/exchange.</p></div>';
    else if(mode!=="authenticated")main+=url;
    var primary=mode==="manual"||mode==="auth-failure"?'<button type="button" class="btn btn--primary" data-exchange>Complete authorization</button>':mode==="authenticated"?'<button type="button" class="btn btn--primary" data-close-dialog>Done</button>':'<button type="button" class="btn" data-manual>Enter code or redirect</button>';
    return'<div class="scrim" data-od-id="mcp-authorize-scrim" role="dialog" aria-modal="true" aria-labelledby="auth-title" aria-describedby="auth-description"><section class="dialog" tabindex="-1" data-od-id="mcp-authorize-dialog"><header class="dialog__head"><span class="dialog__head-icon">'+ICONS.plug+'</span><div class="dialog__head-copy"><div class="eyebrow">linear · workspace · oauth2_pkce</div><h2 id="auth-title">Authorize linear</h2><p id="auth-description">Complete provider authorization without exposing codes or tokens in server configuration.</p></div><button class="btn btn--ghost btn--icon" type="button" data-close-dialog aria-label="Close authorize dialog">'+ICONS.close+'</button></header><div class="dialog__body">'+main+'</div><footer class="dialog__foot"><span class="foot-status">Existing credentials stay unchanged until a confirmed exchange.</span><button class="btn btn--ghost" type="button" data-close-dialog>Cancel</button>'+primary+'</footer></section></div>';
  }
  function transportCards(transport){return'<div class="transport-grid" role="radiogroup" aria-label="Transport">'+["stdio","http","sse"].map(function(value){var desc=value==="stdio"?"Local subprocess":"Remote "+value.toUpperCase()+" endpoint";return'<label class="transport-card"><input type="radio" name="transport" value="'+value+'" '+(value===transport?'checked':'')+'><span><b>'+value+'</b><span>'+desc+'</span></span></label>';}).join("")+'</div>';}
  function monoId(value,label){return'<span class="mono-id"><code title="'+esc(value)+'">'+esc(value)+'</code><button type="button" class="mono-copy" data-copy-value="'+esc(value)+'" aria-label="Copy '+esc(label)+'">'+ICONS.copy+'</button></span>';}
  function bindingChoice(id,refValue){return'<div class="binding-choice" role="radiogroup" aria-label="Secret binding method"><label><input type="radio" name="binding-'+id+'" value="typed" checked><span><b>Write a new value</b><span>Creates its canonical Vault ref</span></span></label><label><input type="radio" name="binding-'+id+'" value="ref"><span><b>Use Vault</b><span>Select an existing credential</span></span></label></div><div class="binding-input" data-binding-panel="'+id+'"><label class="field-label" for="secret-'+id+'">New secret value <span class="hint">write-only</span></label><input class="input mono" type="password" id="secret-'+id+'" autocomplete="new-password" placeholder="Enter replacement value"><p class="field-help">AGH stores this value on save and returns the computed canonical Vault ref. The value is never reflected.</p></div><div class="binding-input hide" data-binding-ref="'+id+'"><label class="field-label" for="ref-'+id+'">Existing Vault ref</label><select class="select mono" id="ref-'+id+'"><option>'+esc(refValue)+'</option><option>vault:operator/shared/mcp-fallback</option></select><p class="field-help">This path selects an existing credential only. Choose Write a new value to create a new canonical binding.</p></div>';}
  function argumentEditor(){return'<div class="row-editor" data-od-id="mcp-stdio-args"><div class="row-editor__row"><span class="row-index">1</span><input class="input mono" aria-label="Argument 1" value="-y"><button class="btn btn--ghost row-remove" type="button" data-remove-row aria-label="Remove argument 1">'+ICONS.close+'</button></div><div class="row-editor__row"><span class="row-index">2</span><input class="input mono" aria-label="Argument 2" value="@modelcontextprotocol/server-github"><button class="btn btn--ghost row-remove" type="button" data-remove-row aria-label="Remove argument 2">'+ICONS.close+'</button></div><button class="btn btn--ghost btn--sm row-editor__add" type="button" data-add-arg>+ Add argument</button></div>';}
  function environmentEditor(){return'<div class="row-editor" data-od-id="mcp-stdio-env"><div class="row-editor__row row-editor__row--env"><input class="input mono" aria-label="Environment key" value="LOG_LEVEL"><input class="input mono" aria-label="Environment value" value="info"><button class="btn btn--ghost row-remove" type="button" data-remove-row aria-label="Remove environment variable">'+ICONS.close+'</button></div><button class="btn btn--ghost btn--sm row-editor__add" type="button" data-add-env>+ Add variable</button></div>';}
  function stdioEditor(){return'<div class="editor-sections"><section class="form-section"><header class="form-section__head"><h3>Process</h3><span class="eyebrow">stdio only</span></header><div class="field"><label class="field-label" for="server-name">Name <span class="hint">locked</span></label><input class="input mono" id="server-name" value="github-local" disabled></div><div class="field"><label class="field-label" for="command">Command <span class="hint">required</span></label><input class="input mono" id="command" value="npx"></div><div class="field"><span class="field-label">Args <span class="hint">ordered rows</span></span>'+argumentEditor()+'</div><div class="field"><span class="field-label">Non-secret environment <span class="hint">key / value</span></span>'+environmentEditor()+'</div><div class="field"><label class="field-label" for="target">Persistence target</label><select class="select mono" id="target"><option>workspace mcp.json</option><option>workspace config.toml</option></select></div><div class="notice"><strong>Local process fields only.</strong> Stdio accepts command, ordered args, env, and secret bindings. URL and OAuth are omitted.</div></section><section class="form-section" data-od-id="mcp-stdio-secret-bindings"><header class="form-section__head"><h3>Secret environment</h3><span class="eyebrow">hybrid binding</span></header><div class="binding"><span class="binding__key">Current binding</span>'+monoId("vault:mcp/ws/ws-platform/github-local/env/github_personal_access_token","Vault reference")+'</div><div class="field"><label class="field-label" for="secret-key">Environment key</label><input class="input mono" id="secret-key" value="GITHUB_PERSONAL_ACCESS_TOKEN"></div>'+bindingChoice("stdio","vault:mcp/ws/ws-platform/github-local/env/github_personal_access_token")+'<div class="notice"><strong>Values stay hidden.</strong> Existing bindings render as identifiers. Typed replacements are write-only and return only as canonical Vault refs.</div></section></div>';}
  function discoveryCards(){var entries=[{id:"issuer",title:"Issuer URL",desc:"Discover from issuer metadata"},{id:"metadata",title:"Metadata URL",desc:"Use a metadata document"},{id:"endpoints",title:"Endpoint pair",desc:"Authorization + token URLs"}];return'<div class="discovery-grid" role="radiogroup" aria-label="OAuth metadata strategy">'+entries.map(function(item){return'<label class="discovery-card"><input type="radio" name="discovery" value="'+item.id+'" '+(discovery===item.id?'checked':'')+'><span><b>'+item.title+'</b><span>'+item.desc+'</span></span></label>';}).join("")+'</div>';}
  function oauthModeCards(){return'<div class="discovery-grid oauth-mode" role="radiogroup" aria-label="Remote authorization"><label class="discovery-card"><input type="radio" name="oauth-mode" value="none" '+(!oauthEnabled?'checked':'')+'><span><b>None</b><span>No provider authorization</span></span></label><label class="discovery-card"><input type="radio" name="oauth-mode" value="oauth" '+(oauthEnabled?'checked':'')+'><span><b>OAuth 2.1 + PKCE</b><span>Browser or manual completion</span></span></label></div>';}
  function remoteEditor(transport){var isSSE=transport==="sse";var name=isSSE?"sentry":"linear";var url=isSSE?"https://mcp.sentry.dev/sse":"https://mcp.linear.app/mcp";var metadataField=discovery==="issuer"?'<label class="field-label" for="issuer-url">Issuer URL <span class="hint">required</span></label><input class="input mono" id="issuer-url" value="https://auth.'+name+'.com">':discovery==="metadata"?'<label class="field-label" for="metadata-url">Metadata URL <span class="hint">required</span></label><input class="input mono" id="metadata-url" value="https://auth.'+name+'.com/.well-known/oauth-authorization-server">':'<div class="row-fields"><div><label class="field-label" for="authorization-url">Authorization URL</label><input class="input mono" id="authorization-url" value="https://auth.'+name+'.com/oauth/authorize"></div><div><label class="field-label" for="token-url">Token URL</label><input class="input mono" id="token-url" value="https://auth.'+name+'.com/oauth/token"></div></div>';
    var oauthPanel=oauthEnabled?'<div class="oauth-panel" data-od-id="mcp-remote-oauth-fields"><div class="field"><label class="field-label" for="client-id">Client ID <span class="hint">required</span></label><input class="input mono" id="client-id" value="agh-'+name+'-public"></div><div class="field"><span class="field-label">Metadata strategy <span class="hint">choose one</span></span>'+discoveryCards()+'</div><div class="field" id="metadata-field">'+metadataField+'</div><div class="field"><span class="field-label">Current client secret</span>'+monoId("vault:mcp/ws/ws-platform/"+name+"/oauth/client-secret","OAuth client secret reference")+'</div><div class="field"><span class="field-label">Replace client secret <span class="hint">optional</span></span>'+bindingChoice("oauth","vault:mcp/ws/ws-platform/"+name+"/oauth/client-secret")+'</div><div class="field"><label class="field-label" for="scopes">Scopes</label><input class="input mono" id="scopes" value="read write"></div></div>':'<div class="notice" data-od-id="mcp-remote-oauth-none"><strong>No authorization fields are persisted.</strong> Select OAuth 2.1 + PKCE to configure discovery, client credentials, and scopes.</div>';
    return'<div class="editor-sections"><section class="form-section"><header class="form-section__head"><h3>Remote endpoint</h3><span class="eyebrow">'+transport+'</span></header><div class="field"><label class="field-label" for="server-name">Name <span class="hint">locked</span></label><input class="input mono" id="server-name" value="'+name+'" disabled></div><div class="field"><label class="field-label" for="remote-url">URL <span class="hint">required</span></label><input class="input mono" id="remote-url" value="'+url+'"></div><div class="field"><label class="field-label" for="target">Persistence target</label><select class="select mono" id="target"><option>workspace mcp.json</option><option>workspace config.toml</option></select></div><div class="notice"><strong>Remote exclusivity.</strong> HTTP and SSE definitions accept URL and optional OAuth fields only. Command, args, env, and secret_env are omitted.</div></section><section class="form-section" data-od-id="mcp-remote-oauth"><header class="form-section__head"><h3>Authorization</h3><span class="eyebrow">optional</span></header>'+oauthModeCards()+oauthPanel+'</section></div>';}
  function editorMarkup(mode){var transport=mode.replace("editor-","");var body='<div class="editor-intro"><div class="eyebrow">Transport</div>'+transportCards(transport)+'</div>'+(transport==="stdio"?stdioEditor():remoteEditor(transport));return'<div class="scrim" data-od-id="mcp-editor-scrim" role="dialog" aria-modal="true" aria-labelledby="editor-title" aria-describedby="editor-description"><form class="dialog dialog--editor" tabindex="-1" data-od-id="'+EDITOR_IDS[transport]+'"><header class="dialog__head"><span class="dialog__head-icon">'+ICONS.edit+'</span><div class="dialog__head-copy"><div class="eyebrow">MCP server · '+scope+'</div><h2 id="editor-title">Edit '+(transport==="stdio"?'github-local':transport==="http"?'linear':'sentry')+'</h2><p id="editor-description">Saving replaces the complete server definition in the selected target.</p></div><button class="btn btn--ghost btn--icon" type="button" data-close-dialog aria-label="Close editor">'+ICONS.close+'</button></header><div class="dialog__body">'+body+'</div><footer class="dialog__foot"><span class="foot-status">Plaintext secrets are write-only.</span><button class="btn btn--ghost" type="button" data-close-dialog>Cancel</button><button class="btn btn--primary" type="submit">Save changes</button></footer></form></div>';}
  function closeDialog(){var selector=returnFocusSelector;setQuery("matrix",selected);if(selector)requestAnimationFrame(function(){var target=document.querySelector(selector);if(target)target.focus();});}
  function bind(){
    document.querySelectorAll("[data-scope]").forEach(function(button){button.setAttribute("aria-checked",button.dataset.scope===scope?"true":"false");button.onclick=function(){scope=button.dataset.scope;var url=new URL(location.href);url.searchParams.set("scope",scope);history.replaceState(null,"",url);render();};});
    document.querySelectorAll("[data-select]").forEach(function(button){button.onclick=function(){setQuery("matrix",button.dataset.select);};});
    document.querySelectorAll("[data-authorize]").forEach(function(button){button.onclick=function(){returnFocusSelector='[data-authorize="'+button.dataset.authorize+'"]';setQuery("authorize",button.dataset.authorize);};});
    document.querySelectorAll("[data-edit]").forEach(function(button){button.onclick=function(){returnFocusSelector='[data-edit="'+button.dataset.edit+'"]';var server=SERVERS.find(function(item){return item.name===button.dataset.edit;});setQuery("editor-"+(server?server.transport:"stdio"),button.dataset.edit);};});
    document.querySelectorAll("[data-action='add']").forEach(function(button){button.onclick=function(){returnFocusSelector='[data-action="add"]';setQuery("editor-stdio","");};});
    var clear=document.querySelector("[data-clear-selection]");if(clear)clear.onclick=function(){setQuery("matrix","");};
    var retry=document.querySelector("[data-action='retry']");if(retry)retry.onclick=function(){setQuery("matrix",selected);};
    document.querySelectorAll("[data-close-dialog]").forEach(function(button){button.onclick=closeDialog;});
    var manual=document.querySelector("[data-manual]");if(manual)manual.onclick=function(){setQuery("manual",selected||"linear");};
    var exchange=document.querySelector("[data-exchange]");if(exchange)exchange.onclick=function(){var value=document.getElementById("manual-value").value.trim();if(!value){document.getElementById("manual-value").setAttribute("aria-invalid","true");document.getElementById("live-region").textContent="Code or redirect URL is required";return;}setQuery("authenticated",selected||"linear");};
    var copyURL=document.querySelector("[data-copy-url]");if(copyURL)copyURL.onclick=function(){if(navigator.clipboard)navigator.clipboard.writeText(authURL()).catch(function(){});copyURL.innerHTML=ICONS.check+"Copied";};
    var openURL=document.querySelector("[data-open-url]");if(openURL)openURL.onclick=function(){window.open(authURL(),"_blank","noopener,noreferrer");};
    document.querySelectorAll("[data-copy-value]").forEach(function(button){button.onclick=function(){if(navigator.clipboard)navigator.clipboard.writeText(button.dataset.copyValue).catch(function(){});};});
    document.querySelectorAll('input[name="transport"]').forEach(function(input){input.onchange=function(){setQuery("editor-"+input.value,selected);};});
    document.querySelectorAll('input[name="discovery"]').forEach(function(input){input.onchange=function(){discovery=input.value;document.getElementById("dialog-root").innerHTML=editorMarkup(state);bind();};});
    document.querySelectorAll('input[name="oauth-mode"]').forEach(function(input){input.onchange=function(){oauthEnabled=input.value==="oauth";document.getElementById("dialog-root").innerHTML=editorMarkup(state);bind();};});
    document.querySelectorAll('input[name^="binding-"]').forEach(function(input){input.onchange=function(){var id=input.name.replace("binding-","");var typed=document.querySelector('[data-binding-panel="'+id+'"]');var ref=document.querySelector('[data-binding-ref="'+id+'"]');if(typed)typed.classList.toggle("hide",input.value!=="typed");if(ref)ref.classList.toggle("hide",input.value!=="ref");};});
    document.querySelectorAll("[data-remove-row]").forEach(function(button){button.onclick=function(){button.closest(".row-editor__row").remove();};});
    var addArg=document.querySelector("[data-add-arg]");if(addArg)addArg.onclick=function(){var editor=addArg.closest(".row-editor");var index=editor.querySelectorAll(".row-editor__row").length+1;addArg.insertAdjacentHTML("beforebegin",'<div class="row-editor__row"><span class="row-index">'+index+'</span><input class="input mono" aria-label="Argument '+index+'" value=""><button class="btn btn--ghost row-remove" type="button" data-remove-row aria-label="Remove argument '+index+'">'+ICONS.close+'</button></div>');bind();};
    var addEnv=document.querySelector("[data-add-env]");if(addEnv)addEnv.onclick=function(){addEnv.insertAdjacentHTML("beforebegin",'<div class="row-editor__row row-editor__row--env"><input class="input mono" aria-label="Environment key" value=""><input class="input mono" aria-label="Environment value" value=""><button class="btn btn--ghost row-remove" type="button" data-remove-row aria-label="Remove environment variable">'+ICONS.close+'</button></div>');bind();};
    var form=document.querySelector("form.dialog");if(form)form.onsubmit=function(event){event.preventDefault();setQuery("matrix",selected);};
  }
  function render(){
    document.getElementById("scope-context").textContent=scope==="global"?"global · operator home":"workspace · ws-platform";
    document.querySelectorAll("[data-scope]").forEach(function(button){button.setAttribute("aria-checked",button.dataset.scope===scope?"true":"false");});
    var root=document.getElementById("content-root");var selectionRoot=document.getElementById("selection-root");var count=document.getElementById("top-count");
    count.textContent=state==="empty"?"0":state==="loading"||state==="error"?"—":String(SERVERS.length);
    selectionRoot.innerHTML=(state==="empty"||state==="loading"||state==="error")?"":selectionMarkup();
    root.innerHTML=state==="loading"?loadingMarkup():state==="empty"?emptyMarkup():state==="error"?errorMarkup():matrixMarkup();
    if(state==="authenticated"){var linear=SERVERS[1];linear.auth="authenticated";linear.authDetail="token present";linear.token=true;linear.runtime="ready";linear.probe="succeeded";linear.tools=8;root.innerHTML=matrixMarkup();}
    var dialog=document.getElementById("dialog-root");dialog.innerHTML=state.indexOf("editor-")===0?editorMarkup(state):["authorize","manual","auth-failure","authenticated"].indexOf(state)>=0?authorizeMarkup(state):"";
    document.getElementById("app-shell").setAttribute("aria-hidden",dialog.innerHTML?"true":"false");
    bind();
    var panel=dialog.querySelector(".dialog");if(panel)requestAnimationFrame(function(){panel.focus({preventScroll:true});});
  }
  document.addEventListener("keydown",function(event){var dialog=document.querySelector("#dialog-root .dialog");if(!dialog)return;if(event.key==="Escape"){event.preventDefault();closeDialog();return;}if(event.key!=="Tab")return;var focusable=Array.from(dialog.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),a[href]')).filter(function(item){return item.offsetParent!==null;});if(!focusable.length)return;var first=focusable[0];var last=focusable[focusable.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}});
  render();
})();
</script>
