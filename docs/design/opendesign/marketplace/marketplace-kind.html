<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Marketplace · Kind · AGH</title>
<link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>

  :root{
    color-scheme: dark;
    --rail:#0c0b0b; --canvas:#131211; --canvas-soft:#1a1918; --canvas-tint:#1c1b1a; --elevated:#232220;
    --fg:#ececef; --fg-strong:#f6f6f8; --muted:#9a9a9f; --subtle:#76767c; --faint:#545458;
    --line:rgba(255,255,255,.055); --line-soft:rgba(255,255,255,.03); --line-strong:rgba(255,255,255,.09);
    --accent:#e8572a; --accent-hover:#d14e25; --accent-strong:#f6874f; --accent-ink:#17110f;
    --accent-tint:rgba(232,87,42,.10); --accent-dim:rgba(232,87,42,.24);
    --success:#5fbf85; --success-tint:rgba(95,191,133,.08);
    --warning:#d6a647; --warning-tint:rgba(214,166,71,.08);
    --danger:#e0635a;  --danger-tint:rgba(224,99,90,.09);
    --info:#8e8eb5;    --info-tint:rgba(142,142,181,.12);
    --neutral:#7a7a80; --neutral-tint:rgba(150,150,155,.06);
    --row-hover:rgba(255,255,255,.022); --row-selected:rgba(255,255,255,.03);
    --input-fill:rgba(255,255,255,.025); --badge-fill:rgba(255,255,255,.05);
    --btn-fill:rgba(255,255,255,.04); --btn-hover:rgba(255,255,255,.07);
    --surface-glaze:rgba(255,255,255,.04);
    --scrim:rgba(0,0,0,.55);
    --radius-xs:4px; --radius-sm:5px; --radius:6px; --radius-md:8px; --radius-lg:10px; --radius-xl:14px; --radius-pill:9999px;
    --font-sans:"Inter Variable","Inter",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    --font-mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,monospace;
    --dur:140ms; --ease:cubic-bezier(.2,0,0,1);
    --shadow-overlay:0 24px 48px -12px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.045);
    --highlight:inset 0 1px 0 rgba(255,255,255,.035);
    /* R-004: focus ring now 2px on a >=3:1 line value (design-spec §13 floor) */
    --focus-line:rgba(255,255,255,.5);
    --focus-ring:0 0 0 2px var(--focus-line);
    --focus-ring-inset:inset 0 0 0 2px var(--focus-line);
    --size-catalog-logo:24px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--canvas);color:var(--fg);font-family:var(--font-sans);font-feature-settings:"cv01","ss03","cv11";
    font-size:13.5px;line-height:1.5;letter-spacing:-.006em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  a{color:inherit;text-decoration:none}
  button,input,textarea,select{font-family:inherit}
  ::selection{background:var(--accent-tint);color:var(--fg-strong)}
  svg{display:block}
  .hide{display:none!important}
  code,kbd,pre,.mono,.topbar__count,.count-chip,.catalog-card__meta .mono-slug,.listing-row__slug,.listing-row__meta .k,.pill[data-mono="true"],.kv__v code,.cfg-block,.toast{
    -webkit-font-smoothing:subpixel-antialiased;-moz-osx-font-smoothing:auto;font-feature-settings:normal}
  :is(.btn,.pill-group__item,.head-close,.switch,.select):focus-visible{outline:none;box-shadow:var(--focus-ring)}
  a.catalog-card:focus-visible,a.listing-row:focus-visible{outline:none;box-shadow:var(--focus-ring-inset)}
  .shell{height:100vh}
  .main{display:flex;flex-direction:column;min-width:0;height:100vh;overflow:hidden}
  .topbar{display:flex;align-items:center;gap:12px;height:48px;padding:0 16px;border-bottom:1px solid var(--line);flex:none;background:var(--canvas);min-width:0;overflow:hidden}
  .topbar__title{display:flex;align-items:center;gap:8px;min-width:0;flex:none}
  .topbar__icon{display:inline-flex;width:24px;height:24px;flex:none;align-items:center;justify-content:center;border-radius:var(--radius-sm);background:var(--elevated);color:var(--accent)}
  .topbar__icon svg{width:12px;height:12px}
  .topbar__h1{font-size:14px;font-weight:500;letter-spacing:-.014em;color:var(--fg-strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar__count{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;padding:0 6px;border-radius:var(--radius-xs);background:var(--canvas-soft);font-family:var(--font-mono);font-size:10.5px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
  .topbar__tabs{display:flex;min-width:0;flex:1;align-items:center;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none}
  .topbar__tabs::-webkit-scrollbar{display:none}
  .topbar__trailing{display:flex;align-items:center;gap:8px;flex:none}
  .topbar:not(:has(.topbar__tabs)) .topbar__trailing{margin-left:auto}
  .crumb{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);min-width:0}
  .crumb a:hover{color:var(--fg-strong)}
  .crumb b{color:var(--fg-strong);font-weight:560}
  .crumb svg{width:13px;height:13px;color:var(--faint);flex:none}
  .search{display:flex;align-items:center;gap:8px;height:26px;min-width:220px;width:min(420px,100%);padding:0 8px;border:1px solid var(--line);
    border-radius:var(--radius);background:var(--canvas-soft);color:var(--fg);font-size:13px;flex:none}
  .search svg{width:12px;height:12px;flex:none;color:var(--subtle)}
  .search input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font-size:13px;outline:none}
  .search input::placeholder{color:var(--subtle)}
  .search .kbd{margin-left:auto;font-size:11px;font-weight:600;letter-spacing:-.005em;text-transform:uppercase;line-height:1;color:var(--subtle);
    border:1px solid var(--line);border-radius:var(--radius-xs);padding:1px 4px;flex:none;background:var(--canvas-soft)}
  .search:focus-within{border-color:var(--line-strong);box-shadow:var(--focus-ring)}
  .btn{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:var(--radius-md);font-size:12px;
    font-weight:500;letter-spacing:-.005em;border:1px solid var(--line);background:var(--btn-fill);color:var(--fg);cursor:pointer;white-space:nowrap;
    transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),color var(--dur) var(--ease)}
  .btn svg{width:14px;height:14px}
  .btn:hover{background:var(--btn-hover);border-color:var(--line-strong);color:var(--fg-strong)}
  .btn:active:not(:disabled){transform:translateY(1px)}
  .btn--primary{background:var(--accent);border-color:transparent;color:var(--accent-ink);box-shadow:var(--highlight)}
  .btn--primary:hover{background:var(--accent-hover);color:var(--accent-ink)}
  .btn--ghost{background:transparent;border-color:transparent;color:var(--fg)}
  .btn--ghost:hover{background:var(--row-hover);color:var(--fg);border-color:transparent}
  .btn--danger{background:var(--danger-tint);border-color:transparent;color:var(--danger)}
  .btn--warning{background:var(--warning-tint);border-color:transparent;color:var(--warning)}
  .btn:disabled,.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
  .btn--sm{height:22px;padding:0 10px;font-size:11px}
  .btn--sm svg{width:12px;height:12px}
  .btn--icon{width:26px;padding:0;justify-content:center}
  .btn--spin svg{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .scroll{flex:1;min-height:0;overflow-y:auto}
  .page{max-width:1320px;margin:0 auto;padding:28px 36px 80px}
  .head{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px}
  .head__main{min-width:0}
  .head__titlerow{display:flex;align-items:center;gap:10px}
  .head__title{font-size:1.4rem;font-weight:600;letter-spacing:-.028em;color:var(--fg-strong)}
  .count-chip{display:inline-flex;align-items:center;min-height:19px;padding:1px 6px;border-radius:var(--radius-xs);
    background:var(--canvas-soft);border:1px solid var(--line-soft);font-family:var(--font-mono);font-size:11px;font-weight:500;
    color:var(--muted);font-variant-numeric:tabular-nums}
  .head__meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:7px;font-size:12px;color:var(--subtle)}
  .dotsep{width:2px;height:2px;border-radius:50%;background:var(--faint);flex:none;display:inline-block}
  .listing-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line-soft)}
  .listing-toolbar__leading{display:flex;flex-wrap:wrap;align-items:center;gap:8px;flex:1;min-width:0}
  .listing-toolbar__trailing{display:flex;align-items:center;gap:10px;margin-left:auto;flex:none}
  .pill-group{display:inline-flex;align-items:center;gap:1px;padding:2px;background:var(--canvas-soft);border-radius:var(--radius-md)}
  .pill-group__item{display:inline-flex;align-items:center;gap:6px;min-height:24px;padding:0 10px;border-radius:var(--radius-xs);font-size:12px;
    font-weight:500;letter-spacing:-.005em;color:var(--subtle);background:transparent;border:0;cursor:pointer;text-decoration:none;
    transition:color var(--dur) var(--ease),background var(--dur) var(--ease);white-space:nowrap}
  .pill-group__item:hover{color:var(--muted)}
  .pill-group__item[aria-pressed="true"],.pill-group__item[aria-current="page"]{color:var(--fg-strong);background:var(--elevated);box-shadow:var(--highlight)}
  .section-block{margin-top:28px}
  .section-block:first-of-type{margin-top:8px}
  .section-head{display:flex;align-items:center;gap:8px;padding:0 2px 10px}
  .section-head__label{font-size:11px;font-weight:600;letter-spacing:-.005em;color:var(--subtle);text-transform:uppercase}
  .section-head__count{font-family:var(--font-mono);font-size:11px;font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
  .section-head__pad{flex:1}
  .section-head__link{font-size:12px;font-weight:500;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
  .section-head__link:hover{color:var(--fg-strong)}
  .section-head__link svg{width:12px;height:12px}
  .section-error{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-md);background:var(--danger-tint);color:var(--danger);font-size:12.5px;margin-bottom:10px}
  .section-error .pad{flex:1}
  .section-collapsed{padding:2px 2px 0;font-size:12px;color:var(--subtle)}
  .listing-card-grid{display:grid;grid-template-columns:repeat(1,minmax(0,1fr));gap:12px}
  @media(min-width:640px){.listing-card-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(min-width:1280px){.listing-card-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  .catalog-card{display:flex;flex-direction:column;gap:12px;min-width:0;padding:16px;border-radius:var(--radius-lg);
    background:var(--canvas-soft);color:inherit;cursor:pointer;transition:background var(--dur) var(--ease);height:100%}
  .catalog-card:hover{background:var(--elevated)}
  .catalog-card.is-dim{opacity:.55}
  .catalog-card__head{display:flex;align-items:flex-start;gap:12px;min-width:0}
  .catalog-card__logo{width:var(--size-catalog-logo);height:var(--size-catalog-logo);border-radius:var(--radius);background:var(--surface-glaze);
    color:var(--muted);display:grid;place-items:center;flex:none}
  .catalog-card__logo svg{width:14px;height:14px}
  .catalog-card__title-wrap{min-width:0;flex:1}
  .catalog-card__title{font-size:13px;font-weight:500;color:var(--fg-strong);letter-spacing:-.012em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* Meta uses muted (AA) — subtle fails 3.89:1 on canvas-soft; design-spec §2.3 / §14.13 */
  .catalog-card__meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:4px;font-size:11px;font-weight:500;
    letter-spacing:-.005em;color:var(--muted)}
  .catalog-card__meta .mono-slug{font-family:var(--font-mono);font-size:10.5px;font-weight:400;letter-spacing:0;color:var(--muted)}
  .catalog-card__desc{font-size:13px;line-height:1.5;color:var(--muted);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .catalog-card__err{font-size:12px;color:var(--danger);margin-top:-4px}
  .catalog-card__actions{margin-top:auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
  .catalog-card__actions .btn{margin-left:auto}
  .pill{display:inline-flex;align-items:center;gap:6px;height:19px;padding:0 8px;border-radius:var(--radius-xs);
    font-size:11px;font-weight:500;letter-spacing:-.005em;line-height:1;width:max-content;background:var(--neutral-tint);color:var(--muted)}
  .pill[data-mono="true"]{font-family:var(--font-mono);font-size:10.5px;font-weight:600;letter-spacing:0}
  .pill[data-tone="success"]{background:var(--success-tint);color:var(--success)}
  .pill[data-tone="warning"]{background:var(--warning-tint);color:var(--warning)}
  .pill[data-tone="danger"]{background:var(--danger-tint);color:var(--danger)}
  .pill[data-tone="info"]{background:var(--info-tint);color:var(--info)}
  .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:56px 24px;
    border-radius:var(--radius-lg);text-align:center;color:var(--subtle)}
  .empty svg{width:38px;height:38px;padding:11px;border-radius:var(--radius-lg);background:var(--canvas-soft);color:var(--subtle)}
  .empty b{font-size:18px;font-weight:500;color:var(--fg-strong);letter-spacing:-.022em}
  .empty p{font-size:13px;max-width:28rem;line-height:1.6;color:var(--muted)}
  .empty .btn{margin-top:4px}
  .list{border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;background:var(--canvas-soft)}
  .listing-row{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:14px;padding:14px 16px;
    border-bottom:1px solid var(--line-soft);transition:background var(--dur) var(--ease);color:inherit}
  .listing-row:last-child{border-bottom:0}
  .listing-row:hover{background:var(--row-hover)}
  .listing-row__icon{width:34px;height:34px;border-radius:var(--radius-md);background:var(--elevated);color:var(--muted);display:grid;place-items:center;flex:none}
  .listing-row__icon svg{width:17px;height:17px}
  .listing-row__main{min-width:0}
  .listing-row__name{display:flex;align-items:center;gap:8px;min-width:0}
  .listing-row__name b{font-size:14px;font-weight:500;color:var(--fg-strong);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .listing-row__slug{font-family:var(--font-mono);font-size:11px;color:var(--muted);white-space:nowrap;flex:none}
  .listing-row__desc{margin-top:3px;font-size:12.5px;line-height:1.45;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .listing-row__meta{margin-top:5px;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);flex-wrap:wrap}
  .listing-row__meta .k{font-family:var(--font-mono);font-size:10px;color:var(--muted)}
  .listing-row__trail{display:flex;align-items:center;gap:10px;flex:none}
  .tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:16px;height:40px}
  .tabs__item{position:relative;height:40px;padding:0 14px;border:0;background:transparent;color:var(--subtle);font-size:13px;font-weight:500;cursor:pointer}
  .tabs__item:hover{color:var(--muted)}
  .tabs__item[aria-selected="true"]{color:var(--fg-strong)}
  .tabs__item[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:1.5px;background:var(--fg-strong);border-radius:1px}
  .switch{position:relative;width:32px;height:18px;border-radius:999px;background:var(--elevated);border:1px solid var(--line);cursor:pointer;flex:none}
  .switch[aria-checked="true"]{background:var(--success-tint);border-color:color-mix(in srgb,var(--success) 35%,transparent)}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--muted);transition:transform var(--dur) var(--ease),background var(--dur) var(--ease)}
  .switch[aria-checked="true"]::after{transform:translateX(14px);background:var(--success)}
  .scrim{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(3px);display:grid;place-items:center;padding:28px;z-index:40}
  .modal{width:min(560px,100%);max-height:min(720px,92vh);background:var(--canvas-soft);border-radius:var(--radius-lg);
    box-shadow:var(--shadow-overlay);display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
  .modal--md{width:min(720px,100%)}
  .modal__head{display:flex;align-items:flex-start;gap:14px;padding:18px 20px 16px;border-bottom:1px solid var(--line-soft)}
  .head-icon{flex:none;width:34px;height:34px;border-radius:var(--radius-lg);display:grid;place-items:center;background:var(--surface-glaze);color:var(--muted)}
  .head-icon svg{width:17px;height:17px}
  .head-txt{flex:1;min-width:0}
  .eyebrow{font-size:11px;font-weight:600;letter-spacing:-.005em;text-transform:uppercase;color:var(--subtle)}
  .modal__title{font-size:15px;font-weight:500;color:var(--fg-strong);letter-spacing:-.014em;margin-top:3px}
  .modal__sub{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.45}
  .head-close{flex:none;width:30px;height:30px;border-radius:var(--radius);border:1px solid var(--line);background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer}
  .head-close:hover{background:var(--row-hover);color:var(--fg)}
  .head-close svg{width:16px;height:16px}
  .modal__body{overflow-y:auto;padding:18px 20px 20px;min-height:0}
  .modal__foot{display:flex;align-items:center;gap:10px;padding:13px 20px;border-top:1px solid var(--line-soft);background:var(--canvas-tint)}
  .foot-pad{flex:1}
  .field{margin-bottom:16px}
  .field:last-child{margin-bottom:0}
  .field__label{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500;color:var(--fg);margin-bottom:6px}
  .field__hint{margin-left:auto;font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:.06em;color:var(--faint);background:var(--badge-fill);border-radius:var(--radius-xs);padding:2px 6px;text-transform:uppercase}
  .field__desc{font-size:11.5px;color:var(--subtle);margin:-2px 0 8px}
  .field__err{font-size:11.5px;color:var(--danger);margin-top:6px}
  .input{width:100%;height:32px;padding:0 11px;color:var(--fg);background:var(--elevated);border:1px solid var(--line);
    border-radius:var(--radius-md);font-size:12.5px;outline:none}
  .input.mono{font-family:var(--font-mono);font-size:12px}
  .input:focus{border-color:var(--line-strong);box-shadow:var(--focus-ring);background:var(--canvas)}
  .input::placeholder{color:var(--faint)}
  .input--err{border-color:color-mix(in srgb,var(--danger) 55%,transparent)}
  .ro-row{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:10px 12px;border-radius:var(--radius-md);background:var(--canvas-tint);margin-bottom:8px;font-size:12.5px}
  .ro-row .k{color:var(--subtle);font-weight:500}
  .ro-row .v{font-family:var(--font-mono);font-size:12px;color:var(--fg);word-break:break-all}
  .scope{display:flex;gap:8px}
  .scope label{flex:1;display:flex;align-items:flex-start;gap:10px;padding:12px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--canvas);cursor:pointer}
  .scope label:has(input:checked){border-color:var(--line-strong);background:var(--elevated)}
  .scope input{margin-top:2px}
  .scope b{display:block;font-size:12.5px;font-weight:500;color:var(--fg-strong)}
  .scope span{display:block;font-size:11.5px;color:var(--subtle);margin-top:3px;line-height:1.4}
  .switch-field{display:flex;align-items:flex-start;gap:12px;padding:12px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--canvas)}
  .switch-field__txt{flex:1;min-width:0}
  .switch-field b{display:block;font-size:12.5px;font-weight:500;color:var(--fg-strong)}
  .switch-field span{display:block;font-size:11.5px;color:var(--subtle);margin-top:3px;line-height:1.4}
  .preview-table{width:100%;border-collapse:collapse;font-size:12.5px}
  .preview-table th{text-align:left;font-size:11px;font-weight:600;letter-spacing:-.005em;text-transform:uppercase;color:var(--subtle);padding:0 0 10px;border-bottom:1px solid var(--line)}
  .preview-table td{padding:10px 0;border-bottom:1px solid var(--line-soft);vertical-align:middle}
  .preview-table tr:last-child td{border-bottom:0}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:10px;

      +'<div class="catalog-card__desc">'+esc(item.desc)+'</div>'+err
      +'<div class="catalog-card__actions">'+footerPills(item, kind, !!opts.showKind)
      +'<button type="button" class="'+btnClass+'" data-action="'+act.verb+'" data-id="'+item.id+'" data-kind="'+kind+'" aria-label="'+act.label+' '+esc(item.name)+'">'+act.label+'</button>'
      +'</div></a>';
  }
  function matches(item, q){
    if(!q) return true;
    q = q.toLowerCase();
    return [item.name, item.desc, item.author, item.source, item.transport].filter(Boolean).join(" ").toLowerCase().indexOf(q) >= 0;
  }
  function dlValue(s){ if(!s) return 0; var m=parseFloat(s); return /k/i.test(s)? m*1000 : m; }
  function sortItems(items, sort){
    var arr=items.slice();
    if(sort==="downloads") arr.sort(function(a,b){ return dlValue(b.downloads)-dlValue(a.downloads); });
    else if(sort==="name") arr.sort(function(a,b){ return a.name.localeCompare(b.name); });
    return arr;
  }
  function showToast(msg, linkHref, linkLabel, linkTitle){
    var t = document.getElementById("toast");
    if(!t) return;
    var linkHtml = "";
    if(linkHref === "skills" || linkHref === "mcp"){
      linkHtml = ' <a href="#" title="'+esc(linkTitle||("Opens /"+linkHref+" in the app"))+'" data-app-route="'+linkHref+'">'+esc(linkLabel||"Manage →")+'</a>';
    } else if(linkHref){
      linkHtml = ' <a href="'+linkHref+'"'+(linkTitle?' title="'+esc(linkTitle)+'"':'')+'>'+esc(linkLabel||"Manage →")+'</a>';
    }
    t.innerHTML = esc(msg) + linkHtml;
    t.classList.remove("hide");
    var appLink = t.querySelector("[data-app-route]");
    if(appLink){
      appLink.addEventListener("click", function(e){
        e.preventDefault();
        showToast("Opens /"+appLink.getAttribute("data-app-route")+" in the app");
      });
    }
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(function(){ t.classList.add("hide"); }, 4600);
  }
  function manageHref(kind, item){
    var m = KIND_META[kind];
    if(m.manageItem && item) return m.manageItem(item);
    return m.manage;
  }
  function openManage(kind, item){
    var href = manageHref(kind, item);
    if(href === "skills" || href === "mcp"){
      showToast(KIND_META[kind].manageTitle || ("Opens /"+href+" in the app"));
      return;
    }
    location.href = href;
  }
  function params(){
    var p = new URLSearchParams(location.search);
    return { kind: p.get("kind")||"mcp", q: p.get("q")||"", sort:p.get("sort")||"", install: p.get("install"), activate: p.get("activate"), state:p.get("state"), browse:p.get("browse"), fail:p.get("fail"), conflict:p.get("conflict") };
  }

  var p = params();
  var kind = ["skills","extensions","bundles","mcp"].indexOf(p.kind)>=0 ? p.kind : "mcp";
  var q = p.q, sort = p.sort;
  var switchEl = document.getElementById("kind-nav");
  var grid = document.getElementById("grid");
  var empty = document.getElementById("empty");
  var input = document.getElementById("search-input");

  input.placeholder = "Search "+KIND_META[kind].label.toLowerCase();
  var lastInvoker=null;

  (function buildKindNav(){
    var overview = document.createElement("a");
    overview.className = "pill-group__item";
    overview.href = "marketplace.html"+(q?"?q="+encodeURIComponent(q):"");
    overview.textContent = "Overview";
    overview.dataset.kind = "overview";
    overview.setAttribute("data-od-id", "nav-overview");

    ["skills","extensions","bundles","mcp"].forEach(function(k){

  function buildSort(){
    // R-008/§2.2: toolbar trailing = Sort only (kind switcher lives in the topbar navigator)
    var opts=SORTS[kind];
    var cur=opts.find(function(o){ return o.v===sort; }) || opts[0];
    var host=document.getElementById("toolbar-trailing");
    host.innerHTML='<label class="select" title="Sort results"><span class="lbl">Sort:</span> <span class="val" id="sort-val">'+cur.l+'</span>'
      +'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>'
      +'<select id="sort-select" aria-label="Sort results">'+opts.map(function(o){ return '<option value="'+o.v+'"'+(o.v===sort?' selected':'')+'>'+o.l+'</option>'; }).join("")+'</select></label>';
    document.getElementById("sort-select").addEventListener("change", function(){
      sort=this.value; document.getElementById("sort-val").textContent=this.options[this.selectedIndex].textContent; syncUrl(); render();
    });

  function syncUrl(){
    var u = new URL(location.href);
    u.searchParams.set("kind", kind);
    if(q) u.searchParams.set("q", q); else u.searchParams.delete("q");
    if(sort) u.searchParams.set("sort", sort); else u.searchParams.delete("sort");
    history.replaceState(null, "", u.toString());
    Array.prototype.forEach.call(switchEl.querySelectorAll("[data-kind]"), function(a){
      var k = a.getAttribute("data-kind");
      if(k==="overview"){ a.href = "marketplace.html"+(q?"?q="+encodeURIComponent(q):""); return; }
      a.href = "marketplace-kind.html?kind="+k+(q?"&q="+encodeURIComponent(q):"");
    });
  }

  function skeletonGrid(){
    var card='<div class="skel-card"><div class="skel skel-line" style="width:60%"></div><div class="skel skel-line" style="width:85%;margin-top:6px"></div><div class="skel skel-line" style="width:40%;margin-top:auto"></div></div>';
    var out=""; for(var i=0;i<6;i++) out+=card; return out;
  }

  function render(){
    document.getElementById("kind-meta").textContent = KIND_META[kind].label + " · browse and install";
    // R-006 loading state
    if(p.state==="loading"){
      empty.classList.add("hide");
      document.getElementById("showing").classList.add("hide");
      grid.innerHTML=skeletonGrid();
      document.getElementById("kind-count").textContent="—";
      return;
    }
    // R-011 error state
    if(p.state==="error"){
      grid.innerHTML="";
      empty.classList.remove("hide");
      document.getElementById("showing").classList.add("hide");
      document.getElementById("kind-count").textContent="—";
      empty.innerHTML='<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg>'
        +'<b>'+KIND_META[kind].label+' marketplace is unreachable</b><p>The source did not respond. Retry, or come back in a moment.</p>'
        +'<button type="button" class="btn btn--sm" id="err-retry">Retry</button></div>';
      var r=document.getElementById("err-retry"); if(r) r.onclick=function(){ var u=new URL(location.href); u.searchParams.delete("state"); history.replaceState(null,"",u.toString()); p.state=null; render(); };
      return;
    }
    // R-011 query-required idle (skills/extensions demand a query today — demo via ?browse=query)
    if(!q && p.browse==="query" && (kind==="skills"||kind==="extensions")){
      grid.innerHTML="";
      empty.classList.remove("hide");
      document.getElementById("showing").classList.add("hide");
      document.getElementById("kind-count").textContent="0";
      empty.innerHTML='<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>'
        +'<b>Search the '+kind+' marketplace</b><p>Type a '+kind.replace(/s$/,'')+' name, author, or keyword to browse.</p></div>';
      return;
    }
    var items = sortItems((CATALOG[kind]||[]).filter(function(it){ return matches(it, q); }), sort);
    document.getElementById("kind-count").textContent = String(items.length);
    // R-012: no fake "Showing N of M" — the mock has no real M > N, so the line stays hidden.
    document.getElementById("showing").classList.add("hide");
    if(items.length===0){
      grid.innerHTML="";
      empty.classList.remove("hide");
      empty.innerHTML = '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/></svg>'
        +'<b>No '+KIND_META[kind].label.toLowerCase()+' match this query</b>'
        +'<p>Try another keyword, or clear the search.</p>'
        +'<button type="button" class="btn btn--sm" id="clear-q">Clear search</button></div>';
      var c=document.getElementById("clear-q"); if(c) c.onclick=function(){ q=""; input.value=""; syncUrl(); render(); };
    } else {
      empty.classList.add("hide");
      grid.innerHTML = items.map(function(it){ return renderCard(it, kind, {showKind:false}); }).join("");
    }
  }

  // ---------- MCP guided install (transport-aware, R-002) ----------
  var mcpItem=null, bundleItem=null;
  function openMcp(item, invoker){
    mcpItem=item; lastInvoker=invoker||document.activeElement;
    var isRemote = item.transport==="http" || item.transport==="sse";
    document.getElementById("mcp-title").textContent = "Install "+item.name;
    document.getElementById("mcp-eyebrow").textContent = "MCP · "+item.transport+" · curated";
    document.getElementById("mcp-sub").textContent = isRemote
      ? "Remote server. AGH writes the config, then runs the OAuth authorize step after install."
      : "Required fields come from the curated feed. The server is written via settings MCP config.";
    var body = document.getElementById("mcp-body");
    var scopeField = '<div class="field" style="margin-top:4px"><div class="field__label">Scope</div>'
      +'<div class="scope"><label><input type="radio" name="scope" value="workspace" checked /><div><b>Workspace</b><span>Available to agents in this workspace only.</span></div></label>'
      +'<label><input type="radio" name="scope" value="global" /><div><b>Global</b><span>Available across workspaces on this daemon.</span></div></label></div></div>';

    if(isRemote){
      // http/sse: read-only URL + Transport, auth summary, NO secret fields (config forbids secret_env on remote)
      body.innerHTML =
        '<div id="mcp-errstrip"></div>'
        +'<div class="ro-row"><div class="k">URL</div><div class="v">'+item.url+'</div></div>'
        +'<div class="ro-row"><div class="k">Transport</div><div class="v">'+item.transport+'</div></div>'
        +'<div class="auth-block" style="margin-top:12px"><div class="auth-block__head"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="var(--info)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><b>Authorization · '+item.auth.type+'</b></div>'
        +'<div class="ro-row"><div class="k">Issuer</div><div class="v">'+item.auth.issuer_url+'</div></div>'
        +'<div class="ro-row"><div class="k">Scopes</div><div class="v">'+item.auth.scopes.join(", ")+'</div></div></div>'
        +'<p class="field__desc" style="margin:8px 0 14px">No secret is stored for remote servers. You authorize in the browser after install.</p>'
        + scopeField;
      document.getElementById("mcp-submit").disabled = false; // remote has no required fields
    } else {
      var fields = (item.required||[]).map(function(f,i){
        return '<div class="field"><label class="field__label" for="mcp-f-'+i+'"><span class="mono">'+f.key+'</span>'
          +(f.secret?'<span class="field__hint">secret</span>':'')+'</label>'
          +'<p class="field__desc">'+esc(f.hint)+'</p>'
          +'<input class="input mono" id="mcp-f-'+i+'" data-req="1" type="'+(f.secret?'password':'text')+'" autocomplete="off" />'
          +'<div class="field__err hide" id="mcp-e-'+i+'"></div></div>';
      }).join("");
      body.innerHTML =
        '<div id="mcp-errstrip"></div>'
        +'<div class="ro-row"><div class="k">Command</div><div class="v">'+item.command+'</div></div>'
        +'<div class="ro-row"><div class="k">Transport</div><div class="v">'+item.transport+'</div></div>'
        + scopeField
        +'<div class="field__label" style="margin:14px 0 10px">Required configuration</div>'+fields;
      document.getElementById("mcp-submit").disabled = true;
      body.querySelectorAll("[data-req]").forEach(function(el){
        el.addEventListener("input", validateMcp);
        el.addEventListener("blur", function(){
          if(!el.value.trim()){ el.classList.add("input--err"); el.nextElementSibling.classList.remove("hide"); el.nextElementSibling.textContent="Required"; }
          else { el.classList.remove("input--err"); el.nextElementSibling.classList.add("hide"); }
        });
      });
      setTimeout(function(){ var first=body.querySelector("[data-req]"); if(first) first.focus(); }, 30);
    }
    document.getElementById("mcp-scrim").classList.remove("hide");
    if(isRemote) setTimeout(function(){ document.getElementById("mcp-submit").focus(); }, 30);
  }
  function validateMcp(){
    var ok=true;
    document.querySelectorAll("#mcp-body [data-req]").forEach(function(el){ if(!el.value.trim()) ok=false; });
    document.getElementById("mcp-submit").disabled = !ok;
  }
  function closeMcp(){ document.getElementById("mcp-scrim").classList.add("hide"); mcpItem=null; if(lastInvoker&&lastInvoker.focus) lastInvoker.focus(); }

  // ---------- Bundle activation (real controls, R-003) ----------
  var bundleScope="workspace", bundleProfileIdx=0, bundleBind=false;
  function openBundle(item, invoker){
    bundleItem=item; lastInvoker=invoker||document.activeElement;
    bundleScope="workspace"; bundleProfileIdx=0; bundleBind=false;
    document.getElementById("bundle-title").textContent = "Activate "+item.name;
    document.getElementById("bundle-scrim").classList.remove("hide");
    renderBundleBody();
    setTimeout(function(){ var f=document.querySelector('#bundle-body input,#bundle-body .switch'); if(f) f.focus(); }, 30);
  }
  function renderBundleBody(){
    var item=bundleItem, body=document.getElementById("bundle-body"), submit=document.getElementById("bundle-submit");
    var profs=item.profiles||[];
    var profField="";
    if(profs.length>1){
      profField='<div class="field"><div class="field__label">Profile</div><div class="scope" style="flex-direction:column">'
        +profs.map(function(pf,i){ return '<label><input type="radio" name="bprof" value="'+i+'"'+(i===bundleProfileIdx?' checked':'')+' /><div><b>'+esc(pf.name)+'</b><span>'+esc(pf.description)+'</span></div></label>'; }).join("")
        +'</div></div>';
    } else if(profs.length===1){
      profField='<p class="field__desc" style="margin-bottom:14px">Profile <span class="mono" style="color:var(--fg)">'+esc(profs[0].name)+'</span> · '+esc(profs[0].description)+'</p>';
    }
    var scopeField='<div class="field"><div class="field__label">Scope</div>'
      +'<div class="scope"><label><input type="radio" name="bscope" value="workspace"'+(bundleScope==="workspace"?' checked':'')+' /><div><b>Workspace</b><span>Activate in this workspace only.</span></div></label>'
      +'<label><input type="radio" name="bscope" value="global"'+(bundleScope==="global"?' checked':'')+' /><div><b>Global</b><span>Activate across workspaces on this daemon.</span></div></label></div></div>';
    var pf=profs[bundleProfileIdx];
    var bindField='<div class="field"><div class="switch-field"><div class="switch-field__txt"><b>Bind primary channel as default</b><span>Route new sessions from this bundle through <span class="mono" style="color:var(--fg)">'+esc(pf.primary_channel||"—")+'</span>.</span></div>'
      +'<button type="button" class="switch" role="switch" id="bundle-bind" aria-checked="'+(bundleBind?"true":"false")+'" aria-label="Bind primary channel as default"></button></div></div>';
    body.innerHTML = profField + scopeField + bindField
      +'<div class="field__label" style="margin:4px 0 10px">What changes</div><div id="bundle-preview"></div>';
    submit.disabled=true; submit.textContent="Activate"; submit.classList.remove("btn--spin");
    loadPreview();
    // wire controls
    var pr=body.querySelector('[name="bprof"]');
    body.querySelectorAll('[name="bprof"]').forEach(function(r){ r.addEventListener("change", function(){ bundleProfileIdx=parseInt(this.value,10); renderBundleBody(); }); });
    body.querySelectorAll('[name="bscope"]').forEach(function(r){ r.addEventListener("change", function(){ bundleScope=this.value; loadPreview(); }); });
    var bind=document.getElementById("bundle-bind");
    if(bind) bind.addEventListener("click", function(){ bundleBind=!bundleBind; this.setAttribute("aria-checked", bundleBind?"true":"false"); });
  }
  function loadPreview(){
    var host=document.getElementById("bundle-preview"), submit=document.getElementById("bundle-submit");
    if(!host) return;
    submit.disabled=true;
    host.innerHTML='<p class="field__desc">Loading preview…</p>';
    setTimeout(function(){
      var pf=bundleItem.profiles[bundleProfileIdx];
      // R-015: preview error / conflict (409/422) in-body with Retry (demo via ?conflict=1)
      if(p.conflict){
        host.innerHTML='<div class="error-strip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg><span>Conflict: <b>'+esc((pf.inventory[0]||{}).resource_name)+'</b> is already managed by another activation (HTTP 409).</span><span class="pad"></span><button class="btn btn--ghost btn--sm" id="prev-retry">Retry</button></div>';
        var rt=document.getElementById("prev-retry"); if(rt) rt.onclick=function(){ var u=new URL(location.href); u.searchParams.delete("conflict"); history.replaceState(null,"",u.toString()); p.conflict=null; loadPreview(); };
        return;
      }
      var rows=(pf.inventory||[]).map(function(r){
        var pill=r.action==="add"?'<span class="pill" data-mono="true">add</span>':'<span class="pill" data-mono="true">already present</span>';
        return '<tr><td><span class="pill" data-mono="true">'+r.resource_kind+'</span></td><td><b style="font-weight:500">'+esc(r.resource_name)+'</b></td><td class="mono" style="font-family:var(--font-mono);font-size:11px;color:var(--muted)">'+(r.version==="—"?"—":"v"+r.version)+'</td><td>'+pill+'</td></tr>';
      }).join("");
      var groups="";
      function grp(label, arr, sub){ if(!arr||!arr.length) return; groups+='<div class="prof-group"><div class="prof-group__label">'+label+'</div>'+arr.map(function(x){ return '<div class="group-list__row"><span class="pill" data-mono="true">'+label.replace(/s$/,'').toLowerCase()+'</span><span class="nm">'+esc(x.name)+'</span><span class="sub">'+sub(x)+'</span></div>'; }).join("")+'</div>'; }
      grp("Agents", pf.agents, function(a){ return (a.provider||'')+(a.model?' · '+a.model:''); });
      grp("Jobs", pf.jobs, function(j){ return j.agent_name+(j.enabled?' · enabled':' · off'); });
      grp("Triggers", pf.triggers, function(t){ return t.event+' · '+t.agent_name; });
      grp("Bridges", pf.bridges, function(b){ return b.platform+' · '+b.display_name; });
      host.innerHTML='<table class="preview-table"><thead><tr><th>Kind</th><th>Name</th><th>Version</th><th>Action</th></tr></thead><tbody>'+rows+'</tbody></table>'+groups;
      submit.disabled=false;
    }, 420);
  }
  function closeBundle(){ document.getElementById("bundle-scrim").classList.add("hide"); bundleItem=null; if(lastInvoker&&lastInvoker.focus) lastInvoker.focus(); }

  // ---------- events ----------
  grid.addEventListener("click", function(e){
    var btn=e.target.closest("[data-action]"); if(!btn) return;
    e.preventDefault(); e.stopPropagation();
    var id=btn.getAttribute("data-id"); var k=btn.getAttribute("data-kind");
    var item=(CATALOG[k]||[]).find(function(x){return x.id===id;}); if(!item) return;
    var action=btn.getAttribute("data-action");
    if(action==="manage"){ openManage(k, item); return; }
    if(k==="mcp" && action==="install"){ openMcp(item, btn); return; }
    if(k==="bundles" && action==="activate"){ openBundle(item, btn); return; }
    if(k==="extensions" && item.trust==="unverified" && action==="install"){
      if(!confirm("Install unverified extension "+item.name+"?\n\nTrust warnings are listed on the detail page.")) return;
    }
    // R-014: keep the spinner element the animation targets (don't swap innerHTML away)
    btn.disabled=true; btn.classList.add("btn--spin");
    btn.innerHTML=spinnerSvg()+(action==="update"?"Updating…":"Installing…");
    setTimeout(function(){ item.state="installed"; render(); showToast(item.name+(action==="update"?" updated":" installed"), manageHref(k, item), "Manage →", KIND_META[k].manageTitle); }, 650);
  });

  document.getElementById("mcp-close").onclick=closeMcp;
  document.getElementById("mcp-cancel").onclick=closeMcp;
  document.getElementById("mcp-scrim").addEventListener("click", function(e){ if(e.target.id==="mcp-scrim") closeMcp(); });
  document.getElementById("mcp-submit").onclick=function(){
    var btn=this; var isRemote = mcpItem.transport==="http" || mcpItem.transport==="sse"; var mi=mcpItem;
    btn.disabled=true; btn.classList.add("btn--spin"); btn.innerHTML=spinnerSvg()+"Installing…";
    setTimeout(function(){
      // R-015: submit-failure error strip above footer (demo via ?fail=1)
      if(p.fail){
        var strip=document.getElementById("mcp-errstrip");
        if(strip) strip.innerHTML='<div class="error-strip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg><span>Config write rejected by the daemon. Fields are preserved.</span></div>';
        btn.disabled=false; btn.classList.remove("btn--spin"); btn.textContent="Install"; return;
      }
      mi.state="installed";
      if(isRemote){ mi._needsAuth=true; }
      closeMcp(); render();
      if(isRemote) showToast(mi.name+" installed", mi.auth_status.authorization_url, "Authorize →");
      else showToast(mi.name+" installed", manageHref("mcp", mi), "Manage →", KIND_META.mcp.manageTitle);
    }, 700);
  };
  document.getElementById("bundle-close").onclick=closeBundle;
  document.getElementById("bundle-cancel").onclick=closeBundle;
  document.getElementById("bundle-scrim").addEventListener("click", function(e){ if(e.target.id==="bundle-scrim") closeBundle(); });
  document.getElementById("bundle-submit").onclick=function(){
    var btn=this, bi=bundleItem; btn.disabled=true; btn.classList.add("btn--spin"); btn.innerHTML=spinnerSvg()+"Activating…";
    setTimeout(function(){ bi.state="installed"; closeBundle(); render(); showToast(bi.name+" activated", manageHref("bundles", bi), "Manage →"); }, 700);
  };
  document.addEventListener("keydown", function(e){
    if(e.key==="Escape"){ if(!document.getElementById("mcp-scrim").classList.contains("hide")) closeMcp(); if(!document.getElementById("bundle-scrim").classList.contains("hide")) closeBundle(); }
    if(e.key==="/" && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){ e.preventDefault(); input.focus(); }
  });
  var t; input.addEventListener("input", function(){ clearTimeout(t); t=setTimeout(function(){ q=input.value.trim(); syncUrl(); render(); }, 160); });

  buildSort();
  render();
  if(p.install){ var mi=(CATALOG.mcp||[]).find(function(x){return x.id===p.install;}); if(mi) openMcp(mi); }
